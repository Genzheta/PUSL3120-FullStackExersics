name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      # Step 1: Clone the repository into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js with the runner
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'DemoTesting/package-lock.json'

      # Step 3: Clean install dependencies inside DemoTesting
      - name: Install dependencies
        working-directory: ./DemoTesting
        run: npm ci

      # Step 4: Run the automated tests inside DemoTesting
      - name: Run tests
        working-directory: ./DemoTesting
        run: npm test
