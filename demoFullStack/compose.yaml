services:

  frontend:
    image: nginx:alpine
    ports:
      - "83:80"
    volumes:
      - ./nginx/app:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    image: node:26.12.0
    volumes:
      - ./node/app:/usr/src/app
    working_dir: /usr/src/app
    expose:
      - "9000"
    command: sh -c "chmod +x run.sh && ./run.sh"