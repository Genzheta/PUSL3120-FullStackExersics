name: demo-ajax

services:
  frontend:
    image: nginx
    volumes:
      - ./app-frontend:/usr/share/nginx/html:ro
    ports:
      - "81:80"

  backend:
    image: node:26.12.0
    volumes:
      - ./app-backend:/usr/src/app
    working_dir: /usr/src/app
    ports:
      - "82:9000"
    command: sh -c "chmod +x run.sh && ./run.sh"